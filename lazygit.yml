promptToReturnFromSubprocess: false
gui:
  border: rounded
  theme:
    activeBorderColor:
      - "#393836"
      - bold
    inactiveBorderColor:
      - "#1D1C19"
    selectedLineBgColor:
      - default
      - underline
    inactiveViewSelectedLineBgColor:
      - default
    defaultFgColor:
      - default
os:
  editPreset: ''
  edit: 'powershell -NoProfile -ExecutionPolicy Bypass -File "C:\Users\robert\AppData\Local\nvim/scripts/open-from-lazygit.ps1" -Path "{{filename}}"'
  editAtLine: 'powershell -NoProfile -ExecutionPolicy Bypass -File "C:\Users\robert\AppData\Local\nvim/scripts/open-from-lazygit.ps1" -Path "{{filename}}" -Line {{line}}'
  editAtLineAndWait: 'powershell -NoProfile -ExecutionPolicy Bypass -File "C:\Users\robert\AppData\Local\nvim/scripts/open-from-lazygit.ps1" -Path "{{filename}}" -Line {{line}}'
